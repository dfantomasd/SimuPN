name: Update exact kenkaral45 mirror

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: update-exact-source-mirror
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test mirror converter
        run: |
          python3 -m py_compile update_subscription.py test_update_subscription.py
          python3 -m unittest -v

      - name: Mirror source without filtering
        run: python3 update_subscription.py

      - name: Validate generated subscription
        run: |
          sha256sum --check routing-data/SHA256SUMS
          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path
          from urllib.parse import urlsplit

          plain = Path("subscription.txt").read_bytes()
          encoded = b"".join(Path("subscription_base64.txt").read_bytes().split())
          assert base64.b64decode(encoded, validate=True) == plain
          lines = plain.decode().splitlines()
          assert lines[0].startswith("happ://routing/onadd/")
          routing_encoded = lines[0].removeprefix("happ://routing/onadd/")
          routing = json.loads(base64.b64decode(routing_encoded, validate=True))
          assert routing["Name"] == "Russia"
          assert Path("routing.txt").read_text().strip() == lines[0]
          assert json.loads(Path("routing.json").read_text()) == routing
          nodes = [line for line in lines if line.startswith("vless://")]
          assert nodes and all(urlsplit(line).scheme == "vless" for line in nodes)
          assert json.loads(Path("status.json").read_text())["server_count"] == len(nodes)
          print(f"Subscription OK: {len(nodes)} exact-source VLESS servers + SIMUTIN")
          PY

      - name: Commit refreshed mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- whitelist_configs_combined.json subscription.txt subscription_base64.txt routing.txt routing.json status.json
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "Update exact kenkaral45 mirror"
          git pull --rebase origin main
          git push origin main
